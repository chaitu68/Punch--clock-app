<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest.json">
<title>Punch Clock</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#111827;--muted:#687386;--line:#e6e9ee;--accent:#111827;--good:#14804a;--danger:#b42318}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
body{padding-bottom:env(safe-area-inset-bottom)}button,input{font:inherit}.app{max-width:560px;margin:auto;min-height:100vh;padding:calc(10px + env(safe-area-inset-top)) 16px 28px}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 4px 18px}.brand{font-size:28px;font-weight:800;letter-spacing:-.7px}.date{font-size:13px;color:var(--muted);text-align:right}
.card{background:var(--card);border:1px solid #e9ecf1;border-radius:24px;padding:18px;box-shadow:0 10px 30px rgba(17,24,39,.06);margin-bottom:14px}
.hero{text-align:center;padding:22px 18px 18px}.eyebrow{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.8px}
.next{font-size:25px;font-weight:800;margin-top:4px}.clock{font-variant-numeric:tabular-nums;font-size:17px;color:var(--muted);margin-top:3px}
.punch{width:184px;height:184px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-weight:800;font-size:22px;letter-spacing:.2px;margin:22px auto 12px;display:block;box-shadow:0 15px 35px rgba(17,24,39,.24);touch-action:manipulation}
.punch:active{transform:scale(.975)}.last{font-size:13px;color:var(--muted);min-height:19px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.stat{background:#f7f8fa;border-radius:16px;padding:12px}.stat b{display:block;font-size:18px}.stat span{font-size:11px;color:var(--muted)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.btn{border:0;border-radius:14px;padding:13px;font-weight:700;background:#eef1f5;color:var(--ink)}.btn.primary{background:#111827;color:#fff}.btn:disabled{opacity:.4}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.section-head b{font-size:17px}.select{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 10px;color:var(--ink)}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px;min-width:430px}th{font-size:11px;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}td{padding:12px 6px;border-bottom:1px solid var(--line);vertical-align:middle}td:last-child,th:last-child{text-align:right}.hours{font-weight:750}.edit{border:0;background:#eef1f5;border-radius:9px;padding:6px 9px;font-size:12px}
.empty{text-align:center;color:#9aa3b2;padding:25px}.footer{text-align:center;color:#9aa3b2;font-size:11px;padding:4px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:flex-end;justify-content:center;z-index:5}.modal.open{display:flex}.sheet{background:#fff;width:min(560px,100%);border-radius:24px 24px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -15px 50px rgba(0,0,0,.2)}.sheet h2{margin:0 0 14px;font-size:21px}.field{margin:10px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px}.sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 17px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:10}.toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
<header class="top"><div><div class="brand">Punch Clock</div><div class="date">Offline attendance</div></div><div class="date" id="today"></div></header>

<section class="card hero">
<div class="eyebrow">Next action</div><div class="next" id="next">Punch In</div><div class="clock" id="clock"></div>
<button class="punch" id="punch">PUNCH IN</button>
<div class="last" id="last">No punch recorded today</div>
<div class="stats"><div class="stat"><b id="todayHours">—</b><span>Today</span></div><div class="stat"><b id="monthHours">0h 0m</b><span>This month</span></div></div>
<div class="actions"><button class="btn primary" id="export">Export Excel</button><button class="btn" id="undo">Undo Last</button></div>
</section>

<section class="card">
<div class="section-head"><b>Monthly history</b><select id="month" class="select"></select></div>
<div class="table-wrap"><table><thead><tr><th>Date</th><th>In</th><th>Out</th><th>Hours</th><th>Edit</th></tr></thead><tbody id="tbody"></tbody></table></div>
</section>
<div class="footer">Your records are stored locally on this device.</div>
</div>

<div class="modal" id="modal"><div class="sheet">
<h2>Edit attendance</h2><div class="field"><label>Date</label><input id="editDate" type="date"></div>
<div class="field"><label>Punch In</label><input id="editIn" type="time"></div>
<div class="field"><label>Punch Out</label><input id="editOut" type="time"></div>
<div class="sheet-actions"><button class="btn" id="cancel">Cancel</button><button class="btn primary" id="saveEdit">Save</button></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
const KEY="punch_clock_records_v2"; let records=JSON.parse(localStorage.getItem(KEY)||"[]"); let editing=null;
const $=id=>document.getElementById(id); const pad=n=>String(n).padStart(2,"0");
const key=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fmtDate=s=>{let [y,m,d]=s.split("-");return new Date(+y,+m-1,+d).toLocaleDateString([], {day:"2-digit",month:"short",year:"numeric"})};
const fmtTime=d=>d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
const mins=t=>{if(!t)return null;let [h,m]=t.split(":").map(Number);return h*60+m};
function duration(r){if(!r.in||!r.out)return null;let a=mins(r.in),b=mins(r.out);if(b<a)b+=1440;return b-a}
function durText(n){if(n==null)return "—";return Math.floor(n/60)+"h "+pad(n%60)+"m"}
function save(){localStorage.setItem(KEY,JSON.stringify(records))}
function monthKey(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)}
function monthLabel(s){let [y,m]=s.split("-");return new Date(+y,+m-1,1).toLocaleDateString([], {month:"long",year:"numeric"})}
function current(){return records.find(r=>r.date===key(new Date()))}
function toast(s){$("toast").textContent=s;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1800)}
function initMonths(){
 let set=new Set(records.map(r=>r.date.slice(0,7)));set.add(monthKey(new Date()));
 let arr=[...set].sort().reverse();$("month").innerHTML=arr.map(m=>`<option value="${m}">${monthLabel(m)}</option>`).join("");
}
function render(){
 let now=new Date(), r=current(), next=r?.in&&!r.out?"Punch Out":"Punch In";
 $("today").textContent=now.toLocaleDateString([], {weekday:"short",day:"2-digit",month:"short"});
 $("clock").textContent=now.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"});
 $("next").textContent=next;$("punch").textContent=next.toUpperCase();
 $("last").textContent=r?(r.out?"Punch Out: "+r.out:"Punch In: "+r.in):"No punch recorded today";
 $("todayHours").textContent=r&&r.out?durText(duration(r)):"—";
 let selected=$("month").value||monthKey(now), list=records.filter(x=>x.date.slice(0,7)===selected).sort((a,b)=>a.date.localeCompare(b.date));
 let total=list.reduce((s,r)=>s+(duration(r)||0),0);$("monthHours").textContent=durText(total);
 $("undo").disabled=records.length===0;
 $("tbody").innerHTML=list.map(r=>`<tr><td>${fmtDate(r.date)}</td><td>${r.in||"—"}</td><td>${r.out||"—"}</td><td class="hours">${durText(duration(r))}</td><td><button class="edit" onclick="edit('${r.date}')">Edit</button></td></tr>`).join("")||`<tr><td colspan="5" class="empty">No records for this month</td></tr>`;
}
window.edit=function(date){let r=records.find(x=>x.date===date);if(!r)return;editing=date;$("editDate").value=r.date;$("editIn").value=r.in||"";$("editOut").value=r.out||"";$("modal").classList.add("open")}
$("cancel").onclick=()=>$("modal").classList.remove("open");
$("saveEdit").onclick=()=>{let d=$("editDate").value,i=$("editIn").value,o=$("editOut").value;if(!d||!i){toast("Date and Punch In are required");return}if(o&&mins(o)<mins(i))toast("Overnight shift will be counted correctly");records=records.filter(x=>x.date!==editing&&x.date!==d);records.push({date:d,in:i,out:o});records.sort((a,b)=>a.date.localeCompare(b.date));save();$("modal").classList.remove("open");initMonths();$("month").value=d.slice(0,7);render();toast("Record updated")};
$("punch").onclick=()=>{let now=new Date(),d=key(now),t=fmtTime(now),r=records.find(x=>x.date===d);if(!r){records.push({date:d,in:t,out:""});toast("Punch In recorded")}else if(!r.out){r.out=t;toast("Punch Out recorded")}else{toast("Today's Punch Out is already recorded");return}save();initMonths();render()};
$("undo").onclick=()=>{if(!records.length)return;if(!confirm("Undo the most recent punch?"))return;records.sort((a,b)=>a.date.localeCompare(b.date));let r=records[records.length-1];if(r.out)r.out="";else records.pop();save();initMonths();render();toast("Last punch undone")};
$("month").onchange=render;

// XLSX writer
const enc=new TextEncoder();function crc32(b){let c=~0;for(let x of b){c^=x;for(let k=0;k<8;k++)c=(c>>>1)^((c&1)?0xEDB88320:0)}return(~c)>>>0}
function u16(n){return new Uint8Array([n&255,n>>>8&255])}function u32(n){return new Uint8Array([n&255,n>>>8&255,n>>>16&255,n>>>24&255])}
function cat(...a){let n=a.reduce((s,x)=>s+x.length,0),o=new Uint8Array(n),p=0;for(let x of a){o.set(x,p);p+=x.length}return o}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function makeXlsx(){
 let selected=$("month").value||monthKey(new Date()), list=records.filter(r=>r.date.slice(0,7)===selected).sort((a,b)=>a.date.localeCompare(b.date));
 let data=[["Date","Punch In","Punch Out","Total Hours"],...list.map(r=>[fmtDate(r.date),r.in||"",r.out||"",durText(duration(r))])];
 let rows=data.map((row,i)=>`<row r="${i+1}">${row.map((v,j)=>`<c r="${String.fromCharCode(65+j)}${i+1}" t="inlineStr"><is><t>${esc(v)}</t></is></c>`).join("")}</row>`).join("");
 let total=list.reduce((s,r)=>s+(duration(r)||0),0);
 rows+=`<row r="${data.length+1}"><c r="A${data.length+1}" t="inlineStr"><is><t>Monthly Total</t></is></c><c r="D${data.length+1}" t="inlineStr"><is><t>${durText(total)}</t></is></c></row>`;
 let files={
 "[Content_Types].xml":`<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>`,
 "_rels/.rels":`<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`,
 "xl/workbook.xml":`<?xml version="1.0" encoding="UTF-8"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Attendance" sheetId="1" r:id="rId1"/></sheets></workbook>`,
 "xl/_rels/workbook.xml.rels":`<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>`,
 "xl/worksheets/sheet1.xml":`<?xml version="1.0" encoding="UTF-8"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${rows}</sheetData></worksheet>`
 };
 let locals=[],centrals=[],off=0;
 for(let [name,txt] of Object.entries(files)){let nb=enc.encode(name),b=enc.encode(txt),c=crc32(b);
 let lh=cat(new Uint8Array([80,75,3,4]),u16(20),u16(0),u16(0),u16(0),u16(0),u32(c),u32(b.length),u32(b.length),u16(nb.length),u16(0),nb,b);locals.push(lh);
 let ch=cat(new Uint8Array([80,75,1,2]),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(c),u32(b.length),u32(b.length),u16(nb.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(off),nb);centrals.push(ch);off+=lh.length}
 let body=cat(...locals),cd=cat(...centrals),n=Object.keys(files).length,end=cat(new Uint8Array([80,75,5,6]),u16(0),u16(0),u16(n),u16(n),u32(cd.length),u32(body.length),u16(0));
 return new Blob([cat(body,cd,end)],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
$("export").onclick=()=>{let list=records.filter(r=>r.date.slice(0,7)===($("month").value||monthKey(new Date())));if(!list.length){toast("No records to export");return}let b=makeXlsx(),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="Punch_Clock_"+($("month").value||monthKey(new Date()))+".xlsx";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast("Excel file created")};
initMonths();render();setInterval(render,1000);
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body></html>
